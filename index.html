<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Browser extensions manager UI</title>
  </head>
  <body>
    <header>
      <img class="logo" src="./assets/images/logo_white.svg" alt="Logo" />

      <button class="switcher">
        <img src="./assets/images/icon-sun.svg" alt="Switch" />
      </button>
    </header>

    <main>
      <div class="head">
        <h2>Extensions List</h2>

        <div class="filter-buttons">
          <button class="active-btn">All</button>
          <button>Active</button>
          <button>Inactive</button>
        </div>
      </div>
      <div class="extensions-grid">

            <div class="card-text">

              <p>
                Quickly inspect page layouts and visualize element boundaries.
              </p>
            </div>
          </div>
          <div class="card-actions">
            <button class="remove-btn">Remove</button>
            <label class="toggle-switch">
              <input type="checkbox" checked />
              <span class="slider"></span>
            </label>
          </div>
        </article>-->
      </div>
    </main>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">AdamDruszad</a>.

</html>
